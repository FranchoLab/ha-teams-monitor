[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ha-teams-status"
version = "0.1.0"
description = "Foundation for a local Teams meeting sensor for Home Assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
macos-service = [
    "pyinstaller>=6.15,<7",
]

[project.scripts]
ha-teams-status = "ha_teams_status.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pre-commit>=4.2,<5",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ha_teams_status"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
